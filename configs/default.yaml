# CASSAVISION Default Configuration
project:
  name: "CASSAVISION"
  version: "1.0.0"
  seed: 42
  description: "Deep Learning-Based Cassava Leaf Disease Classification & Explainable Agricultural AI System"

dataset:
  name: "Makerere / NaCRRI Cassava Leaf Disease Dataset (Kaggle Competition)"
  hf_repo_id: "Engineer101/cassava-leaf-disease-classification"
  raw_dir: "data/raw"
  images_dir: "data/raw/images"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  num_classes: 5
  # Stratified sample size per class / total for local reproducible benchmark
  # Preserves the genuine natural class distribution of the 21,397 full dataset
  target_total_images: 1000
  min_per_class: 90
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  classes:
    0:
      code: "CBB"
      name: "Cassava Bacterial Blight (CBB)"
      pathogen: "Xanthomonas axonopodis pv. manihotis"
      symptoms: "Angular water-soaked leaf spots, blighting, brown necrotic lesions with yellow halos, wilting."
    1:
      code: "CBSD"
      name: "Cassava Brown Streak Disease (CBSD)"
      pathogen: "Cassava brown streak virus (CBSV / UCBSV)"
      symptoms: "Feathery chlorosis along secondary and tertiary veins, yellow blotches on mature lower leaves."
    2:
      code: "CGM"
      name: "Cassava Green Mottle (CGM)"
      pathogen: "Cassava green mottle virus (CGMV)"
      symptoms: "Faint to distinct green mottling, yellow-green mosaic patterns, mild leaf distortion on young leaves."
    3:
      code: "CMD"
      name: "Cassava Mosaic Disease (CMD)"
      pathogen: "Cassava mosaic begomoviruses (transmitted by Bemisia tabaci whiteflies)"
      symptoms: "Severe chlorotic mosaic patches, leaf curling, distortion, reduced leaflet size, stunted growth."
    4:
      code: "Healthy"
      name: "Healthy"
      pathogen: "None (Uninfected foliage)"
      symptoms: "Uniform deep-green palmate lobes, smooth margins, absence of chlorotic mosaic or necrotic lesions."

preprocessing:
  image_size: 224
  eval_resize: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  random_resized_crop_scale: [0.75, 1.0]
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.2
  rotation_degrees: 20
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
    hue: 0.02

training:
  batch_size: 32
  num_workers: 0
  learning_rate_head: 0.001
  learning_rate_backbone: 0.0002
  weight_decay: 0.0001
  label_smoothing: 0.05
  use_class_weights: true
  class_weight_power: 0.5  # damped inverse frequency (sqrt) to balance minority recall without destroying majority precision
  warmup_epochs: 2
  total_epochs: 12
  early_stopping_patience: 4
  candidates:
    - "custom_cnn"
    - "mobilenet_v2"
    - "mobilenet_v3_small"
    - "resnet18"

evaluation:
  confidence_threshold: 0.55
  entropy_threshold: 1.35
  ece_bins: 10
  ood_green_ratio_min: 0.05
  ood_blur_laplacian_min: 15.0
